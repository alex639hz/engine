[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "engine"
version = "0.1.0"
description = "ATS Python Testing Framework Engine"
readme = "README.md"
authors = [
    {name = "Alex Zvuluny", email = "alex.639hz@gmail.com"}
]
license = {text = "MIT"}
requires-python = ">=3.9"
license-files = {globs = ["LICENSE"]}
dependencies = [
    "annotated-doc==0.0.4",
    "annotated-types==0.7.0",
    "anyio==4.13.0",
    "certifi==2026.4.22",
    "click==8.3.1",
    "colorama==0.4.6",
    "dnspython==2.8.0",
    "fastapi==0.135.3",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.11",
    "iniconfig==2.3.0",
    "numpy==2.4.4",
    "packaging==26.2",
    "pluggy==1.6.0",
    "pydantic==2.12.5",
    "pydantic_core==2.41.5",
    "Pygments==2.20.0",
    "pymongo==4.17.0",
    "pytest==9.0.3",
    "pytest-mock==3.15.1",
    "PyVISA==1.16.2",
    "starlette==1.0.0",
    "typing-inspection==0.4.2",
    "typing_extensions==4.15.0",
    "uvicorn==0.42.0",
]
keywords = ["testing", "framework", "ats"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/yourusername/engine"
Repository = "https://github.com/yourusername/engine.git"
Issues = "https://github.com/yourusername/engine/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*"]

[tool.setuptools.package-data]
engine = ["py.typed"]
